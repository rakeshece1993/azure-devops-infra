.logging-box: &logging-box
  - |
    #!/bin/bash
    echo "Initialising logging formatters ..."
    function box() {
      local max_length=0
      local output="$*"
    
      while IFS= read -r line; do
        length=$(echo "$line" | sed -r 's/\x1B\[[0-9;]*m//g' | wc -c)
        if (( length > max_length )); then
          max_length=$length
        fi
      done <<< "$output"

      printf '┌%s┐\n' "$(printf '%*s' "$((max_length + 2))" | tr ' ' '-')"
    
      while IFS= read -r line; do
        length=$(echo "$line" | sed -r 's/\x1B\[[0-9;]*m//g' | wc -c)
        printf '│ %s' "$line"
        printf '%-*s│\n' "$((max_length - length + 2))"
      done <<< "$output"
    
      printf '└%s┘\n' "$(printf '%*s' "$((max_length + 2))" | tr ' ' '-')"
    }

.logging-functions: &logging-functions
  - |
    echo "Initialising logging functions ..."
    RESET="\033[0m"
    RED="\033[1;31m"
    LIGHT_GREEN="\033[1;92m"
    LIGHT_PURPLE="\033[1;95m"
    BLUE="\033[1;34m"
    YELLOW="\033[1;93m"
    
    function log_info() {
      printf "%b\n" "${LIGHT_PURPLE}$*${RESET}"
    }

    function log_error() {
      printf "%b\n" "${RED}$*${RESET}"
    }

    function log_debug() {
      printf "%b\n" "${BLUE}$*${RESET}"
    }
    
    function log_warn() {
      printf "%b\n" "${YELLOW}$*${RESET}"
    }

.export-logging-functions:
  - |
    echo "Exporting logging functions..." 
    # Exporting all logging functions to make them available inside script file
    {
      echo "#!/bin/bash"
      echo
      echo 'RESET="\033[0m"'
      echo 'RED="\033[1;31m"'
      echo 'LIGHT_GREEN="\033[1;92m"'
      echo 'LIGHT_PURPLE="\033[1;95m"'
      echo 'BLUE="\033[1;34m"'
      echo 'YELLOW="\033[1;93m"'
      echo
      declare -f box
      echo
      declare -f log_info
      echo
      declare -f log_error
      echo
      declare -f log_debug
      echo
      declare -f log_warn
    } > "$CI_PROJECT_DIR/logging_functions.sh"

.logging-utilities-initialization:
  - *logging-box
  - *logging-functions
